events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/html image/svg+xml;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nice_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream gunicorn_servers {
        server web:8000;
    }

    server {
        listen 80;

        location ^~ /uploads/ {
            alias /app/media/;
            expires 30d;
        }

        location ~* \.(js|css|jpeg|jpg|png|gif|ico|html|woff2)$ {
            root /app;
            expires 30d;
        }

        location / {
            proxy_pass http://gunicorn_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache nice_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;

            add_header X-Proxy-Cache $upstream_cache_status;
        }
    }
}
