services:
    db:
        image: postgres:18.3-alpine
        container_name: niceanswer_db
        env_file:
            - .env.docker
        volumes:
            - postgres_data:/var/lib/postgresql
        ports:
            - "5432:5432"
    web:
        build: .
        container_name: niceanswer_web
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/app
            - ./media:/app/media
        ports:
          - "8000:8000"
        env_file:
          - .env.docker
        depends_on:
            - db

volumes:
    postgres_data:
