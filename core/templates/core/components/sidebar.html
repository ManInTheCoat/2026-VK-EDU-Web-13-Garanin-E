<aside class="col-lg-4 col-md-12 mb-4 ps-lg-5">

  <div class="mb-4">
    <h4 class="fw-bold mb-3">Popular Tags</h4>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      {% for tag in popular_tags %}
      <a href="#" class="text-decoration-none {{ tag.css }}">{{ tag.name }}</a>
      {% endfor %}
    </div>
  </div>

  <div>
    <h4 class="fw-bold mb-3">Best Members</h4>
    <ul class="list-unstyled">
      {% for member in best_members %}
      <li class="mb-2"><a href="#" class="text-decoration-none">{{ member }}</a></li>
      {% endfor %}
    </ul>
  </div>

</aside>
