<aside class="col-lg-4 col-md-12 mb-4 ps-lg-5">

    <div class="card shadow-sm border-0 bg-white rounded">
        <div class="card-body p-4">

            <div class="mb-4">
                <h4 class="fw-bold mb-3">Popular Tags</h4>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    {% for tag in popular_tags %}
                        <a href="{% url 'tag' tag.name %}" class="text-decoration-none {{ tag.css }}">{{ tag.name }}</a>
                    {% empty %}
                        <span class="text-muted">Пока нет ни одного тега.</span>
                    {% endfor %}
                </div>
            </div>

            <div>
                <h4 class="fw-bold mb-3">Best Members</h4>
                <ul class="list-unstyled mb-0">
                    {% for member in best_members %}
                        <li class="mb-2">{{ member }}</li>
                    {% empty %}
                        <li class="text-muted mb-2">Пока нет активных участников.</li>
                    {% endfor %}
                </ul>
            </div>

        </div>
    </div>

</aside>
