{% extends "core/base.html" %}
{% load static %}

{% block title %}Log In - Nice Answer{% endblock %}

{% block user_panel %}
<a href="{% url 'login' %}" class="text-decoration-none fw-bold text-dark">Log In</a>
<a href="{% url 'signup' %}" class="text-decoration-none text-secondary">Sign Up</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-xl-5 col-lg-6 col-md-9 col-12">

    <h2 class="fw-bold mb-4 text-center">Log In</h2>

    <div class="alert alert-danger mb-4" role="alert">
      Sorry, wrong login or password. Please try again.
    </div>

    <form>
      <div class="mb-3">
        <label for="loginInput" class="form-label fw-bold">Login</label>
        <input type="text" class="form-control" id="loginInput" placeholder="Enter your login">
      </div>

      <div class="mb-4">
        <label for="passwordInput" class="form-label fw-bold">Password</label>
        <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password">
      </div>

      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-5 gap-3">
        <button type="submit" class="btn btn-success fw-bold px-5">Log In</button>
        <a href="{% url 'signup' %}" class="text-decoration-none">Create an account</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
